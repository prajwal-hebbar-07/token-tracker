[package]
name = "token-tracker-desktop"
version = "0.1.4"
edition = "2021"
description = "Token Tracker desktop application"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
include_dir = "0.7"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
wait-timeout = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
